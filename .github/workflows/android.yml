name: Android debug qualification
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
# Feature and PR builds never receive publishing credentials.
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # setup-android@v3 currently invokes obsolete 'sdkmanager tools' and fails.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify release metadata and Android XML before Gradle
        run: |
          python3 tools/check-release-metadata.py
          python3 tools/check-manifest.py
          python3 tools/check-ui.py
          python3 tools/test-verify-apk.py
          python3 tools/test-native-inventory.py
          python3 - <<'PYXML'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files = sorted(Path('app/src/main').rglob('*.xml'))
          for file in files: ET.parse(file)
          print(f'PASS: {len(files)} Android XML files parsed')
          PYXML
      - name: Install SDK platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $ANDROID_HOME" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Maven Central availability
        run: |
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error --output /tmp/kotlin-stdlib.pom \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.0.21/kotlin-stdlib-2.0.21.pom
          grep -q "<artifactId>kotlin-stdlib</artifactId>" /tmp/kotlin-stdlib.pom
          echo "Maven Central Kotlin standard library POM reachable"
      - name: Compile, unit test, lint, assemble and inspect APK
        run: bash tools/build-and-qualify.sh
      # Print diagnostics to the job log instead of uploading quota-limited artifacts.
      - name: Print diagnostics on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            tail -n 240 "$report"
          else
            echo "No Android lint text report generated."
          fi
