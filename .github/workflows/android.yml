name: Android debug qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # setup-android@v3 currently invokes obsolete 'sdkmanager tools' and fails.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify release metadata and Android XML before Gradle
        run: |
          python3 tools/check-release-metadata.py
          python3 tools/check-manifest.py
          python3 tools/check-ui.py
          python3 - <<'PYXML'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files = sorted(Path('app/src/main').rglob('*.xml'))
          for file in files: ET.parse(file)
          print(f'PASS: {len(files)} Android XML files parsed')
          PYXML
      - name: Install SDK platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $ANDROID_HOME" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compile, unit test, lint, assemble and inspect APK
        run: bash tools/build-and-qualify.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BousyPlayer-v0.11-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Save compiler/lint reports for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BousyPlayer-v0.11-build-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
