name: Android debug qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # setup-android@v3 currently invokes obsolete 'sdkmanager tools' and fails.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify release metadata and Android XML before Gradle
        run: |
          python3 tools/check-release-metadata.py
          python3 tools/check-manifest.py
          python3 tools/check-ui.py
          python3 tools/test-verify-apk.py
          python3 - <<'PYXML'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files = sorted(Path('app/src/main').rglob('*.xml'))
          for file in files: ET.parse(file)
          print(f'PASS: {len(files)} Android XML files parsed')
          PYXML
      - name: Install SDK platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $ANDROID_HOME" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Maven Central availability
        run: |
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error --output /tmp/kotlin-stdlib.pom \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.0.21/kotlin-stdlib-2.0.21.pom
          grep -q "<artifactId>kotlin-stdlib</artifactId>" /tmp/kotlin-stdlib.pom
          echo "Maven Central Kotlin standard library POM reachable"
      - name: Compile, unit test, lint, assemble and inspect APK
        run: bash tools/build-and-qualify.sh
      # Store passing debug APKs as private-repository prerelease assets.
      # Actions artifact storage is currently quota-limited on this account.
      - name: Publish ARM32 and ARM64 debug APKs as prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="debug-v0.25-${GITHUB_SHA:0:8}"
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a; do
            cp "app/build/outputs/apk/debug/app-$abi-debug.apk" \
               "dist/BousyPlayer-v0.25-$abi-debug.apk"
          done
          # The checksum manifest lets testers verify downloaded APK integrity.
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Bousy Player v0.25 ABI Debug (${GITHUB_SHA:0:8})" \
            --notes "ARM32 and ARM64 APKs. Gradle compilation, session/native-adapter regression suites, Android unit tests and lint, ZIP and ELF checks, SHA256 manifest passed. Native playback and remote controls are not yet hardware-verified." \
            --prerelease

      # Print diagnostics to the job log instead of uploading quota-limited artifacts.
      - name: Print diagnostics on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            tail -n 240 "$report"
          else
            echo "No Android lint text report generated."
          fi
