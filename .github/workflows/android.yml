name: Android debug qualification
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
# Feature and PR builds never receive publishing credentials.
permissions:
  contents: read
# New commits supersede older same-branch work; keep independent push and PR
# checks so the exact proposed SHA is still qualified in both contexts.
concurrency:
  group: bousyplayer-android-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # setup-android@v3 currently invokes obsolete 'sdkmanager tools' and fails.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify release metadata and Android XML before Gradle
        run: |
          python3 tools/check-release-metadata.py
          python3 tools/check-manifest.py
          python3 tools/check-ui.py
          python3 tools/check-theme-contrast.py
          python3 tools/test-verify-apk.py
          python3 tools/test-native-inventory.py
          python3 tools/test_apk_signing.py
          python3 tools/test_release_integrity.py
          python3 tools/test_instrumentation_results.py
          python3 - <<'PYXML'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files = sorted(Path('app/src/main').rglob('*.xml'))
          for file in files: ET.parse(file)
          print(f'PASS: {len(files)} Android XML files parsed')
          PYXML
      - name: Install SDK platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $ANDROID_HOME" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"
      # Gradle resolves actual dependencies; the enforce-mode OSV scan fails
      # closed on missing repositories or unavailable advisory responses.
      # Do not probe a hard-coded POM which may be removed upstream.
      - name: Compile, unit test, lint, assemble and inspect APK
        run: bash tools/build-and-qualify.sh
      # Print diagnostics to the job log instead of uploading quota-limited artifacts.
      - name: Print diagnostics on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            tail -n 240 "$report"
          else
            echo "No Android lint text report generated."
          fi

  # Independently execute Android instrumentation on a real emulator process.
  # Push qualification stays fast/read-only; every PR runs this as a second
  # required job, alongside the split ARM32/ARM64 static/native security gate.
  emulator-instrumentation:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 36 SDK for app compilation
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Enable KVM when available; allow Android ATD software fallback
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            echo "KVM acceleration enabled"
          else
            echo "::warning::KVM not exposed by runner; using ATD emulator software acceleration"
          fi
      - name: Run Android lifecycle / SAF privacy tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The x86_64 ABI exists ONLY in this temporary CI build.
          # The main-only publishing workflow still signs/publishes ARM32+ARM64.
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest -PciEmulatorAbi=true
      # Gradle may succeed with zero discovered tests if installation/selection
      # silently changes. Demand saved JUnit XML with every required class.
      - name: Verify executed Android instrumentation results
        run: python3 tools/verify_instrumentation_results.py app/build/outputs/androidTest-results/connected
      - name: Print emulator diagnostics if device tests fail
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -type f -name '*.xml' -maxdepth 8 \
            -print -exec tail -n 70 {} \; 2>/dev/null || true
