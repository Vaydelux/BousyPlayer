name: Android debug prerelease
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # setup-android@v3 currently invokes obsolete 'sdkmanager tools' and fails.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify release metadata and Android XML before Gradle
        run: |
          python3 tools/check-release-metadata.py
          python3 tools/check-manifest.py
          python3 tools/check-ui.py
          python3 tools/check-theme-contrast.py
          python3 tools/test-verify-apk.py
          python3 tools/test-native-inventory.py
          python3 tools/test_apk_signing.py
          python3 tools/test_release_integrity.py
          python3 - <<'PYXML'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files = sorted(Path('app/src/main').rglob('*.xml'))
          for file in files: ET.parse(file)
          print(f'PASS: {len(files)} Android XML files parsed')
          PYXML
      - name: Install SDK platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $ANDROID_HOME" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"
      # Gradle resolves actual dependencies; the enforce-mode OSV scan fails
      # closed on missing repositories or unavailable advisory responses.
      # Do not probe a hard-coded POM which may be removed upstream.
      - name: Compile, unit test, lint, assemble and inspect APK
        run: bash tools/build-and-qualify.sh
      # Store passing debug APKs as private-repository prerelease assets.
      # Actions artifact storage is currently quota-limited on this account.
      - name: Publish ARM32 and ARM64 debug APKs as prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="debug-v0.33-${GITHUB_SHA:0:8}"
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a; do
            cp "app/build/outputs/apk/debug/app-$abi-debug.apk" \
               "dist/BousyPlayer-v0.33-$abi-debug.apk"
          done
          # Publish a resolved Maven SBOM and OSV report alongside each APK.
          cp app/build/reports/security/debug-maven-sbom.cdx.json \
             dist/BousyPlayer-v0.33-maven-sbom.cdx.json
          cp app/build/reports/security/osv-findings.json \
             dist/BousyPlayer-v0.33-osv-report.json
          cp app/build/reports/security/debug-native-inventory.json \
             dist/BousyPlayer-v0.33-native-inventory.json
          cp app/build/reports/security/debug-native-file-sbom.cdx.json \
             dist/BousyPlayer-v0.33-native-file-sbom.cdx.json
          cp app/build/reports/security/debug-signing-report.json \
             dist/BousyPlayer-v0.33-signing-report.json
          # Describe the exact assets, complete commit and Actions run. This
          # checksum evidence is not a trusted/signed SLSA attestation.
          python3 tools/release_integrity.py create --dist dist \
            --version 0.33.0 --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          (cd dist && sha256sum *.apk *.json > SHA256SUMS.txt)
          # The release cannot be created until every checksum, asset name,
          # commit, version and source-run identifier is independently checked.
          python3 tools/release_integrity.py verify --dist dist \
            --version 0.33.0 --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          gh release create "$tag" dist/*.apk dist/*.json dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Bousy Player v0.33 ABI Debug (${GITHUB_SHA:0:8})" \
            --notes "ARM32 and ARM64 APKs. Gradle compilation, session/native-adapter regression suites, Android unit tests and lint, ZIP and ELF checks, Maven SBOM, OSV gate, shipped ELF inventory, native SBOM, dual-ABI signing certificate match, deterministic release asset hash manifest and checksums passed. These are DEBUG-signed and not production-signed or hardware-verified." \
            --prerelease

      # Print diagnostics to the job log instead of uploading quota-limited artifacts.
      - name: Print diagnostics on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            tail -n 240 "$report"
          else
            echo "No Android lint text report generated."
          fi
